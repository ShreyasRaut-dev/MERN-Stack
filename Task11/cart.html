<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 Sneaker Store - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <div class="store-logo">Thala <span>7</span></div>
        <div class="menu">
            <a href="landing.html">Home</a>
            <a href="product.html">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="icons">
            <span>🔍</span>
            <a href="cart.html"><span>🛒</span></a>
            <span>👤</span>
        </div>
    </div>

    <div class="cart-section">
        <div class="cart-left">
            <h2>Shopping Cart</h2>
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Thala 7 Ultra Sneaker</td>
                        <td>1</td>
                        <td>$120.00</td>
                        <td><button class="remove-btn">❌</button></td>
                    </tr>
                </tbody>
            </table>
            <a href="product.html" class="link-continue">Continue Shopping</a>
        </div>
        <div class="cart-right">
            <h3>Promo Code</h3>
            <div class="coupon-section">
                <input type="text" placeholder="Enter coupon">
                <button>Apply</button>
            </div>
            
            <div class="detail-line">
                <span>Sub Total</span>
                <span>$120.00</span>
            </div>
            <div class="detail-line">
                <span>Taxes</span>
                <span>$10.00</span>
            </div>
            <div class="detail-line">
                <span>Discount</span>
                <span>-$20.00</span>
            </div>
            <div class="total-line">
                <span>Total</span>
                <span>$110.00</span>
            </div>
            
            <a href="checkout.html"><button class="paynow-btn">Pay Now</button></a>
            
            <div class="payment-icons">
                <span>💳</span>
                <span>🏦</span>
                <span>📱</span>
                <span>🚀</span>
            </div>
        </div>
    </div>

</body>
</html>
