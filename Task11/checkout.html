<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 Sneaker Store - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <div class="store-logo">Thala <span>7</span></div>
        <div class="menu">
            <a href="landing.html">Home</a>
            <a href="product.html">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="icons">
            <span>🔍</span>
            <a href="cart.html"><span>🛒</span></a>
            <span>👤</span>
        </div>
    </div>

    <div class="checkout-section">
        <div class="checkout-left">
            <h2>Checkout</h2>
            <br>
            <div class="form-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label>Payment Method</label>
                <div class="payment-options">
                    <div class="pay-opt active">Cards</div>
                    <div class="pay-opt">UPI</div>
                    <div class="pay-opt">Bank</div>
                    <div class="pay-opt">Crypto</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="card">Card Number</label>
                <input type="text" id="card" placeholder="1234 5678 9101 1121">
            </div>
            
            <div class="formrow">
                <div class="form-group">
                    <label for="expiry">Expiry</label>
                    <input type="text" id="expiry" placeholder="MM/YY">
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" placeholder="123">
                </div>
            </div>
            
            <div class="formrow">
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="United States">
                </div>
                <div class="form-group">
                    <label for="zip">Zip Code</label>
                    <input type="text" id="zip" placeholder="10001">
                </div>
            </div>
        </div>
        
        <div class="checkout-right">
            <h2>Order Summary</h2>
            <br>
            <div class="coupon-section">
                <input type="text" placeholder="Enter coupon">
                <button>Apply</button>
            </div>
            
            <div class="detail-line">
                <span>Sub Total</span>
                <span>$120.00</span>
            </div>
            <div class="detail-line">
                <span>Taxes</span>
                <span>$10.00</span>
            </div>
            <div class="detail-line">
                <span>Discount</span>
                <span>-$20.00</span>
            </div>
            <div class="total-line">
                <span>Total</span>
                <span>$110.00</span>
            </div>
            
            <button class="paynow-btn">Pay Now</button>
            
            <div class="payment-icons">
                <span>💳</span>
                <span>🏦</span>
                <span>📱</span>
                <span>🚀</span>
            </div>
        </div>
    </div>

</body>
</html>
