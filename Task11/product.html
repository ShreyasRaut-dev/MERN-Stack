<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 Sneaker Store - Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <div class="store-logo">Thala <span>7</span></div>
        <div class="menu">
            <a href="landing.html">Home</a>
            <a href="product.html">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="icons">
            <span>🔍</span>
            <a href="cart.html"><span>🛒</span></a>
            <span>👤</span>
        </div>
    </div>

    <div class="product-section">
        <div class="product-left">
            <img class="product-img" src="images/sneaker1.jpg" alt="Thala 7 Ultra Sneaker">
        </div>
        <div class="product-right">
            <h1 class="product-title">Thala 7 Ultra Sneaker</h1>
            <p class="product-desc">Designed for running and everyday casual comfort. Crafted with premium mesh upper and custom air cushioning technology. Ideal for casual outings or running tracks.</p>
            <div class="product-price">$120.00</div>
            <div class="product-sale">On Sale - Save 20% today!</div>
            
            <div class="quantity-section">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" value="1" min="1">
            </div>
            
            <a href="cart.html"><button class="btn-add">Add to Cart</button></a>
        </div>
    </div>

    <div class="gallery">
        <img class="gallery-img" src="images/sneaker1.jpg" alt="Sneaker 1">
        <img class="gallery-img-two" src="images/sneaker2.jpg" alt="Sneaker 2">
        <img class="gallery-img" src="images/sneaker3.jpg" alt="Sneaker 3">
    </div>

</body>
</html>
