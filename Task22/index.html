<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - AI Workspace</title>

    <!-- tailwind is used from cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-800">

    <!-- navbar part -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <div class="text-xl font-bold">
                ✦ Project
            </div>

            <nav class="flex items-center gap-6 text-sm">
                <a href="#" class="hover:text-orange-600">Product</a>
                <a href="#" class="hover:text-orange-600">Solutions</a>
                <a href="#" class="hover:text-orange-600">Resources</a>
                <a href="#" class="hover:text-orange-600">Pricing</a>
                <a href="#" class="hover:text-orange-600">Log in</a>

                <button class="bg-black text-white px-4 py-2 rounded-lg">
                    Get AI free
                </button>
            </nav>

        </div>
    </header>


    <!-- hero section -->
    <div class="relative min-h-screen bg-gradient-to-b from-orange-100 to-white pt-20 text-center overflow-hidden">

        <div class="max-w-4xl mx-auto px-5">

            <p class="text-orange-600 font-semibold mb-4">
                AI powered workspace
            </p>

            <h1 class="text-5xl md:text-7xl font-bold tracking-tight mt-4">
                Write, plan, share.
                <br>
                <span class="text-gray-500">With AI at your side.</span>
            </h1>

            <p class="text-gray-600 text-lg max-w-2xl mx-auto mt-6">
                Project is a digital workspace that helps teams write,
                plan and collaborate better with simple AI tools.
            </p>


            <!-- buttons - positioning is a little weird but it works -->
            <div class="relative h-20 mt-8">

                <button class="absolute left-[25%] md:left-[35%] top-2 bg-black text-white px-6 py-3 rounded-lg">
                    Get AI free →
                </button>

                <button class="absolute right-[20%] md:right-[27%] top-2 border border-gray-400 bg-white px-6 py-3 rounded-lg">
                    Request a demo
                </button>

            </div>

        </div>


        <!-- dashboard area -->
        <div class="relative max-w-5xl mx-auto h-[500px] mt-8">

            <!-- main dashboard image -->
            <img
                src="https://placehold.co/900x500/fafafa/555?text=Project+Dashboard"
                alt="dashboard"
                class="absolute left-[5%] top-[5%] w-[90%] rounded-xl shadow-2xl border border-gray-200"
            >


            <!-- tasks card -->
            <div class="absolute z-20 left-[2%] top-[28%] bg-white p-4 rounded-xl shadow-xl w-52 text-left">

                <div class="text-2xl mb-2">
                    📋
                </div>

                <p class="font-semibold">
                    Tasks
                </p>

                <p class="text-sm text-gray-500 mt-2">
                    12 tasks completed today
                </p>

            </div>


            <!-- project status card -->
            <div class="absolute z-20 right-[1%] top-[20%] bg-white shadow-xl rounded-xl p-4 w-48 text-left">

                <div class="flex items-center gap-2">
                    <span class="bg-green-100 text-green-700 rounded-full px-2 py-1">
                        ✓
                    </span>

                    <p class="font-semibold">
                        Project Status
                    </p>
                </div>

                <p class="text-green-600 text-sm mt-3">
                    On Track
                </p>

            </div>


            <!-- team card -->
            <div class="absolute z-30 left-[35%] bottom-[4%] bg-white shadow-xl rounded-xl px-5 py-4 flex items-center gap-3">

                <div class="flex -space-x-2">
                    <img
                        src="https://i.pravatar.cc/40?img=1"
                        class="w-9 h-9 rounded-full border-2 border-white"
                    >

                    <img
                        src="https://i.pravatar.cc/40?img=2"
                        class="w-9 h-9 rounded-full border-2 border-white"
                    >

                    <img
                        src="https://i.pravatar.cc/40?img=3"
                        class="w-9 h-9 rounded-full border-2 border-white"
                    >
                </div>

                <p class="text-sm font-medium">
                    +5 online
                </p>

            </div>

        </div>

    </div>


    <!-- chat button -->
    <div class="fixed bottom-6 right-6 z-50">

        <button class="w-14 h-14 rounded-full bg-black text-white text-2xl shadow-lg">
            💬
        </button>

    </div>

</body>
</html>
