<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundy Mart - Login</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="login-container">
<div class="left-section">
<img src="laundry_login.png" alt="Laundry Service Illustration">
</div>
<div class="right-section">
<form class="login-form" onsubmit="return false;">
<h2>Welcome Back</h2>
<p class="description">Login to continiue using Laundry Mart.</p>
<div class="form-group">
<input type="email" placeholder="Enter your email" required>
</div>
<div class="form-group">
<input type="password" placeholder="Enter your passsword" required>
</div>
<button type="submit" class="btn-login">Log in</button>
</form>
</div>
</div>
</body>
</html>
